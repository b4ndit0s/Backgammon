<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gammon Ledger</title>
<meta name="description" content="Backgammon against the computer or a friend online, with chat, move review and a ledger of recurring errors. Exports matches for GNU Backgammon.">
<meta name="theme-color" content="#E7E8E3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151817" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gammon Ledger">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
</style>
<script src="./firebase-config.js"></script>
</head>
<body>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --ground:#E7E8E3; --surface:#FBFBF9; --surface-2:#F1F2EE; --sunken:#DDDFD8;
  --ink:#1B1E1D; --ink-2:#52574F; --ink-3:#83887E;
  --line:#CDD0C7; --line-2:#B2B6AB;
  --blue:#2F6FB5; --blue-d:#1C4C82; --blue-bg:#DCE8F4;
  --clay:#B0522B; --clay-d:#7E381A; --clay-bg:#F3E1D7;
  --good:#1B7A58; --good-bg:#DCEDE5;
  --warn:#9A6209; --bad:#96322E;
  --pt-a:rgba(27,30,29,.38); --pt-b:rgba(27,30,29,.14); --felt:rgba(27,30,29,.10);
  --font-d:"Bodoni Moda",Georgia,serif;
  --font-u:"Archivo",system-ui,-apple-system,sans-serif;
  --font-m:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#151817; --surface:#1E2221; --surface-2:#262B29; --sunken:#111413;
  --ink:#E8EAE5; --ink-2:#A3A89E; --ink-3:#767B72;
  --line:#343A37; --line-2:#474E4A;
  --blue:#5D9BDD; --blue-d:#9BC4EC; --blue-bg:#1B2C3D;
  --clay:#D9773F; --clay-d:#EFA477; --clay-bg:#3A2317;
  --good:#4CB58C; --good-bg:#142D25;
  --warn:#D2A052; --bad:#DE7A74;
  --pt-a:rgba(232,234,229,.30); --pt-b:rgba(232,234,229,.11); --felt:rgba(232,234,229,.07);
}}
:root[data-theme="dark"]{
  --ground:#151817; --surface:#1E2221; --surface-2:#262B29; --sunken:#111413;
  --ink:#E8EAE5; --ink-2:#A3A89E; --ink-3:#767B72;
  --line:#343A37; --line-2:#474E4A;
  --blue:#5D9BDD; --blue-d:#9BC4EC; --blue-bg:#1B2C3D;
  --clay:#D9773F; --clay-d:#EFA477; --clay-bg:#3A2317;
  --good:#4CB58C; --good-bg:#142D25;
  --warn:#D2A052; --bad:#DE7A74;
  --pt-a:rgba(232,234,229,.30); --pt-b:rgba(232,234,229,.11); --felt:rgba(232,234,229,.07);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-u);font-size:15px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--font-d);font-weight:700;font-size:30px;line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:17px;font-weight:600;margin:0}
p{margin:0}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.sub{font-size:13px;color:var(--ink-2);margin-top:3px}
.score{display:flex;gap:8px;font-family:var(--font-m);font-size:13px}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:5px 10px;text-align:center;min-width:64px}
.sc b{display:block;font-size:20px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.sc.p{border-color:var(--blue);color:var(--blue-d)}
.sc.a{border-color:var(--clay);color:var(--clay-d)}
.tabs{display:flex;gap:2px;background:var(--sunken);border-radius:9px;padding:3px}
.tabs button{flex:1;border:0;background:transparent;color:var(--ink-2);font-family:var(--font-u);font-size:14px;font-weight:500;padding:8px 4px;border-radius:7px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.09)}
#bd text{font-family:var(--font-m);font-variant-numeric:tabular-nums}
.board{display:block;width:100%;height:auto;border-radius:10px;overflow:hidden}
.say{font-size:14px;color:var(--ink-2);min-height:42px;font-family:var(--font-m);line-height:1.5}
.say b{color:var(--ink);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 11px}
.stat .k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.stat .v{font-family:var(--font-m);font-size:16px;font-weight:500;font-variant-numeric:tabular-nums}
.stat.p .v{color:var(--blue-d)} .stat.a .v{color:var(--clay-d)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>button{flex:1 1 90px}
button.btn{font-family:var(--font-u);font-size:14px;font-weight:500;padding:10px 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);cursor:pointer}
button.btn:hover{background:var(--surface-2)}
button.btn:active{transform:scale(.985)}
button.btn:disabled{opacity:.42;cursor:default;transform:none}
button.btn.go{background:var(--ink);color:var(--ground);border-color:var(--ink)}
button.btn.go:disabled{background:transparent;color:var(--ink-3);border-color:var(--line)}
button.btn.go:hover{background:var(--ink-2)}
button.btn.cube{border-color:var(--warn);color:var(--warn)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.sheet .hd{display:grid;grid-template-columns:34px 1fr 1fr;font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--ink-3);border-bottom:1px solid var(--line);padding:7px 10px;gap:8px}
.sheet .ln{display:grid;grid-template-columns:34px 1fr 1fr;gap:8px;padding:4px 10px;font-family:var(--font-m);font-size:12.5px;border-bottom:1px solid var(--line)}
.sheet .ln:last-child{border-bottom:0}
.sheet .n{color:var(--ink-3)} .sheet .mp{color:var(--blue-d)} .sheet .ma{color:var(--clay-d)}
.scroll{max-height:220px;overflow-y:auto}
.narr{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:13px 15px;display:flex;flex-direction:column;gap:9px}
.narr .big{font-family:var(--font-m);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.band{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.04em;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.band.b1{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.band.b3{background:var(--clay-bg);color:var(--clay-d);border-color:var(--clay)}
.err{border:1px solid var(--line);border-left:3px solid var(--clay);border-radius:0;background:var(--surface);padding:9px 11px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.err[aria-current="true"]{background:var(--surface-2);border-left-color:var(--ink)}
.err .t{font-family:var(--font-m);font-size:12.5px}
.err .t .was{color:var(--blue-d)} .err .t .bet{color:var(--good)}
.err .m{font-size:11.5px;color:var(--ink-3);display:flex;gap:8px;justify-content:space-between}
.list{display:flex;flex-direction:column;gap:6px}
.cap{font-size:12px;color:var(--ink-3);line-height:1.5}
.cats{display:flex;flex-direction:column;gap:5px}
.cat{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:13px}
.bar{height:7px;background:var(--sunken);border-radius:99px;overflow:hidden;grid-column:1/-1}
.bar i{display:block;height:100%;background:var(--clay);border-radius:99px}
.cat .c{font-family:var(--font-m);font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
textarea{width:100%;height:190px;font-family:var(--font-m);font-size:11px;line-height:1.4;background:var(--sunken);color:var(--ink);border:1px solid var(--line-2);border-radius:8px;padding:9px;white-space:pre;overflow:auto}
.gm{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 11px;border-bottom:1px solid var(--line);font-size:13px}
.gm:last-child{border-bottom:0}
.gm .w{font-family:var(--font-m);font-size:12px;font-weight:500}
.gm .w.win{color:var(--good)} .gm .w.los{color:var(--clay-d)}
.gm .r{font-family:var(--font-m);font-variant-numeric:tabular-nums;font-size:14px;font-weight:500}
.gm .d{font-size:11.5px;color:var(--ink-3)}
.empty{padding:16px;text-align:center;color:var(--ink-3);font-size:13px}

.olbar{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-bottom:10px}
.olbar b{color:var(--ink);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:inline-block;flex:none}
.dot.on{background:var(--good)}
.olbar .code{font-family:var(--font-m);font-size:12px;letter-spacing:.06em;color:var(--ink-3)}
.linkbtn{background:none;border:0;padding:0;font:inherit;font-size:13px;color:var(--blue-d);text-decoration:underline;cursor:pointer}
.warnbar{background:var(--clay-bg);color:var(--clay-d);border:1px solid var(--clay);border-radius:8px;padding:8px 11px;font-size:13px;margin-bottom:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.cards{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
input.txt{font-family:var(--font-u);font-size:16px;padding:9px 11px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0;width:100%}
input.txt:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.bigcode{font-family:var(--font-m);font-size:30px;font-weight:700;letter-spacing:.14em;line-height:1.1}
.share{font-family:var(--font-m);font-size:12px;word-break:break-all;background:var(--sunken);padding:8px 10px;border-radius:7px;color:var(--ink-2)}
.chat{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
.chat .hd{display:flex;justify-content:space-between;align-items:center;padding:8px 11px;border-bottom:1px solid var(--line)}
.chatlog{max-height:200px;min-height:56px;overflow-y:auto;padding:9px 11px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:84%;padding:6px 10px;border-radius:12px;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--blue-bg);border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:var(--clay-bg);border-bottom-left-radius:4px}
.msg small{display:block;font-size:10.5px;color:var(--ink-3);margin-top:1px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 11px 8px}
.chip{font:inherit;font-size:12.5px;padding:4px 10px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink-2);cursor:pointer}
.chatin{display:flex;gap:6px;border-top:1px solid var(--line);padding:8px}
.chatin .btn{flex:none}
.chat .hd{gap:8px}
.vanbtn{font:inherit;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink-2);cursor:pointer;white-space:nowrap}
.vanbtn[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.chat.vanish .chatin{background:var(--sunken)}
.chat.vanish #chatText{border-style:dashed}
.iconbtn{flex:none;width:40px;height:40px;padding:0;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);font-size:19px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.iconbtn[aria-expanded="true"]{background:var(--surface-2);border-color:var(--ink-3)}
.iconbtn svg{width:20px;height:20px}
.emojis{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:2px;padding:6px 8px 8px;border-top:1px solid var(--line)}
.emojis button{font-size:22px;line-height:1;padding:6px 0;border:0;background:none;border-radius:6px;cursor:pointer}
.emojis button:hover,.emojis button:focus-visible{background:var(--surface-2)}
.msg.pic{padding:4px;max-width:70%}
.msg.pic img{display:block;max-width:100%;max-height:260px;border-radius:9px;cursor:zoom-in}
.msg.pic small{padding:2px 6px 1px}
.msg.big{font-size:30px;line-height:1.15;background:none!important;padding:2px 4px}
.msg.van{border:1.5px dashed var(--ink-3)}
.msg .van-t{display:block;font-size:10.5px;font-weight:600;color:var(--clay-d);margin-top:1px}
.msg.gone{opacity:0;transform:scale(.96);transition:opacity .35s,transform .35s}
.chatnote{font-size:11.5px;color:var(--ink-3);padding:0 11px 6px}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(10,12,11,.88);display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.opengames{display:flex;flex-direction:column}
.og{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.og:last-child{border-bottom:0}
.og .sub2{font-size:12px;color:var(--ink-3)}
.og .btn{padding:8px 14px}
.tick{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink-2);cursor:pointer}
.tick input{width:18px;height:18px;margin:1px 0 0;flex:none;accent-color:var(--ink)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:99px;background:var(--clay);color:#fff;font-size:11px;line-height:18px;margin-left:5px;font-weight:600}
.mine{display:flex;flex-direction:column}
.mrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-top:0;font:inherit;color:inherit}
.mrow:last-child{border-bottom:0}
.mrow .st{font-size:12px;font-weight:600}
.mrow .st.go{color:var(--good)}
.mrow .sub2{font-size:12px;color:var(--ink-3);grid-column:1/-1}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:420px){h1{font-size:25px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>

<div class="wrap">
  <div class="head">
    <div>
      <h1>Gammon Ledger</h1>
      <p class="sub" id="sub">Blue moves 24 → 1. Clay moves 1 → 24.</p>
    </div>
    <div class="score">
      <div class="sc p"><b id="scP">0</b>you</div>
      <div class="sc a"><b id="scA">0</b><span data-opp>computer</span></div>
    </div>
  </div>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-play" aria-selected="true">Play</button>
    <button role="tab" id="tab-rev" aria-selected="false">Review</button>
    <button role="tab" id="tab-hist" aria-selected="false">Ledger</button>
    <button role="tab" id="tab-online" aria-selected="false">Online</button>
  </div>

  <section id="pane-play">
    <div id="olwarn" class="warnbar" hidden></div><div id="olbar" class="olbar" hidden></div>
    <svg id="bd" class="board" viewBox="0 0 716 584" role="img" aria-label="Backgammon board"></svg>
    <p class="say" id="say">Setting up.</p>
    <div class="stats" style="margin-top:12px">
      <div class="stat p"><div class="k">your pip</div><div class="v" id="pipP">167</div></div>
      <div class="stat a"><div class="k"><span data-opp>computer</span> pip</div><div class="v" id="pipA">167</div></div>
      <div class="stat p"><div class="k">you rolled</div><div class="v" id="dtP">0</div></div>
      <div class="stat a"><div class="k"><span data-opp>computer</span> rolled</div><div class="v" id="dtA">0</div></div>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn go" id="bRoll">Roll</button>
      <button class="btn cube" id="bDouble">Double</button>
      <button class="btn" id="bUndo">Undo</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="btn" id="bNew">New match</button>
      <button class="btn" id="bMat">Export .mat</button>
    </div>
    <div id="matbox" hidden style="margin-top:10px"></div>
    
    <div id="chat" class="chat" hidden>
      <div class="hd"><span><span class="lbl">Chat</span> <span class="cap" id="chatWho"></span></span><button type="button" class="vanbtn" id="chatVanish" aria-pressed="false" title="Messages you send disappear 10 seconds after your opponent sees them">Vanish off</button></div>
      <div class="chatlog" id="chatLog" aria-live="polite"></div>
      <p class="chatnote" id="chatNote" hidden>Vanish mode: what you send now disappears 10 seconds after it's been seen.</p>
      <div class="chips" id="chatChips"></div>
      <div class="emojis" id="chatEmojis" hidden></div>
      <form class="chatin" id="chatForm">
        <button type="button" class="iconbtn" id="chatEmojiBtn" aria-label="Emoji" aria-expanded="false" aria-controls="chatEmojis">&#128578;</button>
        <button type="button" class="iconbtn" id="chatPicBtn" aria-label="Send a photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="2.5"/><circle cx="9" cy="11" r="2"/><path d="M21 17l-5.5-5.5L6 20"/></svg></button>
        <input type="file" id="chatPic" accept="image/*" hidden>
        <input class="txt" id="chatText" maxlength="500" autocomplete="off" placeholder="Message" aria-label="Message">
        <button class="btn go" type="submit">Send</button>
      </form>
    </div>
    
    <h2 style="margin-top:18px">Move sheet</h2>
    <div class="sheet" style="margin-top:8px">
      <div class="hd"><span>#</span><span>you</span><span data-opp>computer</span></div>
      <div class="scroll" id="sheet"></div>
    </div>
  </section>

  <section id="pane-rev" hidden></section>
  <section id="pane-hist" hidden></section>
  <section id="pane-online" hidden></section>
</div>

<script>
(function(){
"use strict";
var P=1,A=-1;
/* display names: the build for the public web app swaps these */
var OPP="computer",ME="player";
function setNames(opp,me){OPP=opp;if(me)ME=me;
 document.querySelectorAll("[data-opp]").forEach(function(n){n.textContent=OPP})}
var CSS=getComputedStyle(document.documentElement);
function col(n){return "var("+n+")"}

/* ---------- engine ---------- */
function dirOf(pl){return pl===1?-1:1}
function barPt(pl){return pl===1?25:0}
function offPt(pl){return pl===1?0:25}
function clone(s){return{p:s.p.slice(),bar:{1:s.bar[1],"-1":s.bar[-1]},off:{1:s.off[1],"-1":s.off[-1]}}}
function fresh(){var p=new Array(26).fill(0);p[24]=2;p[13]=5;p[8]=3;p[6]=5;p[1]=-2;p[12]=-5;p[17]=-3;p[19]=-5;
return{p:p,bar:{1:0,"-1":0},off:{1:0,"-1":0}}}
function d6(){try{if(window.crypto&&window.crypto.getRandomValues){var a=new Uint8Array(1);
do{window.crypto.getRandomValues(a)}while(a[0]>=252);return (a[0]%6)+1}}catch(e){}
return 1+Math.floor(Math.random()*6)}
function roll2(){var a=d6(),b=d6();return a===b?[a,a,a,a]:[a,b]}
function homeAll(s,pl){if(s.bar[pl]>0)return false;
for(var i=1;i<=24;i++)if(s.p[i]*pl>0&&(pl===1?i>6:i<19))return false;return true}

for(k=0;k<dice.length;k++){var die=dice[k];if(seen[die])continue;seen[die]=1;
 if(s.bar[pl]>0){var tb=barPt(pl)+d*die;if(s.p[tb]*pl>=-1)out.push({f:barPt(pl),t:tb,d:die});continue}
 var home=homeAll(s,pl);
 for(i=1;i<=24;i++){if(s.p[i]*pl<=0)continue;var t=i+d*die;
  if(t>=1&&t<=24){if(s.p[t]*pl>=-1)out.push({f:i,t:t,d:die})}
  else if(home){
   if(t===offPt(pl))out.push({f:i,t:offPt(pl),d:die});
   else{var far=false;
    if(pl===1){for(j=i+1;j<=6;j++)if(s.p[j]>0)far=true}else{for(j=i-1;j>=19;j--)if(s.p[j]<0)far=true}
    if(!far)out.push({f:i,t:offPt(pl),d:die})}}}}
return out}
function step(s,pl,m){if(m.f===barPt(pl))s.bar[pl]--;else s.p[m.f]-=pl;
if(m.t<1||m.t>24){s.off[pl]++;return}
if(s.p[m.t]===-pl){s.p[m.t]=0;s.bar[-pl]++}
s.p[m.t]+=pl}
function skey(s,n){return s.p.join(",")+"|"+s.bar[1]+"|"+s.bar[-1]+"|"+s.off[1]+"|"+s.off[-1]+"|"+n}
/* seen===null at the top level keeps every distinct FIRST move alive,
   so both dice orders are always offered; dedupe only deeper down. */
function walk(s,pl,dice,seq,cb,seen){
var ms=legal(s,pl,dice);
if(!ms.length){cb(s,seq);return}
for(var i=0;i<ms.length;i++){
 var n=clone(s);step(n,pl,ms[i]);
 var nd=dice.slice();nd.splice(nd.indexOf(ms[i].d),1);
 var sub=seen;
 if(seen){var kk=skey(n,nd.length);if(seen[kk])continue;seen[kk]=1}else sub={};

function pip(s,pl){var t=s.bar[pl]*25;
for(var i=1;i<=24;i++){var c=s.p[i]*pl;if(c>0)t+=c*(pl===1?i:25-i)}return t}
function blots(s,pl){var n=0;
for(var i=1;i<=24;i++){if(s.p[i]!==pl)continue;var sh=false,j;
 if(pl===1){for(j=i-1;j>=Math.max(1,i-6);j--)if(s.p[j]<0)sh=true;if(s.bar[A]>0&&i<=6)sh=true}
 else{for(j=i+1;j<=Math.min(24,i+6);j++)if(s.p[j]>0)sh=true;if(s.bar[P]>0&&i>=19)sh=true}
 if(sh)n++}return n}
function made(s,pl,lo,hi){var n=0;for(var i=lo;i<=hi;i++)if(s.p[i]*pl>=2)n++;return n}
/* positive = good for Claude */
function ev(s){var sc=pip(s,P)-pip(s,A);
sc+=(s.off[A]-s.off[P])*14; sc+=s.bar[P]*12-s.bar[A]*12;

 if(c===-1){sh=false;for(j=i+1;j<=Math.min(24,i+6);j++)if(s.p[j]>0)sh=true;
  if(s.bar[P]>0&&i>=19)sh=true;sc-=sh?7:2}
 if(c===1){sh=false;for(j=i-1;j>=Math.max(1,i-6);j--)if(s.p[j]<0)sh=true;
  if(s.bar[A]>0&&i<=6)sh=true;sc+=sh?7:2}
 if(c<=-2){sc+=2;if(i>=19)sc+=3;if(i>=17&&i<=20)sc+=2;if(i<=8)sc+=2}

function evP(s){return -ev(s)}
function classify(s0,got,want){
if((want.bar[A]-s0.bar[A])>(got.bar[A]-s0.bar[A]))return "missed hit";
if(blots(got,P)>blots(want,P))return "left extra shots";
if(made(want,P,1,8)>made(got,P,1,8))return "missed point-making";
if(made(got,P,1,24)<made(want,P,1,24))return "broke a point early";
if(got.off[P]<want.off[P])return "slow bear-off";

function notate(st,pl,seq){var c=clone(st),o=[];

function trailOf(st,pl,seq,tone){var c=clone(st),tr=[];

/* ---------- opening roll ---------- */
function openingRoll(){
var a,b;do{a=d6();b=d6()}while(a===b);
G.diceTot[P]+=a;G.diceTot[A]+=b;
G.dice=[a,b];G.rolled=[a,b];G.usedDice=[];G.rollOwner=0;draw();
G.busy=true;
if(a>b){G.turn=P;G.dice=[a,b];G.opening=false;
 setTimeout(function(){G.busy=false;G.turn=P;G.opening=false;
  G.turnNo=1;G.startS=clone(G.s);G.startDice=[a,b];G.notes=[];G.moves=[];G.hist=[];
  G.rolled=[a,b];G.usedDice=[];G.rollOwner=P;
  computeAllowed();
  if(!G.allowed.length){say("You won the opening roll with <b>"+a+"</b> but <b>"+a+"-"+b+"</b> has no play.");
   setTimeout(playerDone,900);return}
  say("You won the opening roll, <b>"+a+"</b> to "+b+". Play <b>"+a+"-"+b+"</b>.");
  draw()},900)}
else{G.turn=A;G.opening=false;

/* ---------- player turn ---------- */
function computeAllowed(){
var recs=[],mx=0;
walk(clone(G.s),P,G.dice,[],function(st,seq){
 if(seq.length>mx)mx=seq.length;
 if(seq.length)recs.push({l:seq.length,m:seq[0]})},null);
var res=[],i;
for(i=0;i<recs.length;i++)if(recs[i].l===mx&&mx>0)res.push(recs[i].m);
if(mx===1){var hi=Math.max.apply(null,G.dice),any=false;
 for(i=0;i<res.length;i++)if(res[i].d===hi)any=true;
 if(any)res=res.filter(function(m){return m.d===hi})}
var seen={},out=[];
for(i=0;i<res.length;i++){var k=res[i].f+"-"+res[i].t+"-"+res[i].d;
 if(!seen[k]){seen[k]=1;out.push(res[i])}}
G.allowed=out}

function tap(pt){
if(G.busy||G.over||ui.review||!G.dice.length||G.turn!==P)return;
var i,mv=null;
if(G.sel!==null){
 for(i=0;i<G.allowed.length;i++)
  if(G.allowed[i].f===G.sel&&G.allowed[i].t===pt)mv=G.allowed[i];
 if(mv){
  G.hist.push({s:clone(G.s),dice:G.dice.slice(),notes:G.notes.slice(),moves:G.moves.slice(),
   used:G.usedDice.slice(),h:G.hitCt[P]});
  var hit=(G.s.p[mv.t]===A);if(hit)G.hitCt[P]++;
  step(G.s,P,mv);
  G.moves.push({f:mv.f,t:mv.t,d:mv.d});
  G.notes.push((mv.f===25?"bar":mv.f)+"/"+(mv.t<1?"off":mv.t)+(hit?"*":""));
  var ix=G.dice.indexOf(mv.d);if(ix>-1)G.dice.splice(ix,1);
  G.usedDice.push(mv.d);G.sel=null;
  if(G.dice.length){computeAllowed();
   if(!G.allowed.length){draw();say("No further legal move.");setTimeout(playerDone,T(900));return}
   draw();say("Dice left: <b>"+G.dice.join(", ")+"</b>");return}
  playerDone();return}
 if(pt===G.sel){G.sel=null;draw();return}}
var any=false;
for(i=0;i<G.allowed.length;i++)if(G.allowed[i].f===pt)any=true;
G.sel=any?pt:null;draw()}

function gradeTurn(){
if(!G.startS||!G.startDice.length)return;
var b=bestFor(G.startS,P,G.startDice,evP);
if(!b.seq)return;
G.decisions++;
var lost=Math.max(0,b.val-evP(G.s));
G.loss+=lost;
var want=notate(G.startS,P,b.seq),got=G.notes.join(" ");
if(lost>2.5&&want!==got){
 var wt=trailOf(G.startS,P,b.seq,"g");
 var cat=classify(G.startS,G.s,wt.st);

function playerDone(){

/* ---------- Claude turn ---------- */
function aiTurn(){

function aiPlay(dice,fromOpening){
if(!fromOpening)G.diceTot[A]+=dice.reduce(function(a,b){return a+b},0);
var b=bestFor(G.s,A,dice,ev);
animateOpp(dice,b.seq||[],"I rolled",function(txt,none){
 G.busy=false;
 if(checkEnd())return;
 G.turn=P;draw();
 if(none){say(txt+" Your roll.");return}

/* Plays the opponent's moves onto the board one checker at a time, leaving
   the ghost-and-arrow trail. seq is in board coordinates (opponent = A).
   done(text, noMove) runs once the last checker lands. */
function animateOpp(dice,seq,who,done){
G.dice=dice.slice();
G.rolled=dice.slice();G.usedDice=[];G.rollOwner=A;
G.trail=[];draw();
var head=who+" <b>"+dice[0]+"-"+dice[1]+"</b>"+(dice.length===4?" (doubles)":"")+": ";
if(!seq.length){G.log.push({pl:A,dice:dice.slice(0,2),moves:[]});
 say(head+"no legal move.");
 setTimeout(function(){G.dice=[];draw();done(head+"no legal move.",true)},T(1400));return}
say(head+"thinking.");
var k=0,shown=[],mat=[];
(function next(){
 if(k>=seq.length){
  G.log.push({pl:A,dice:dice.slice(0,2),moves:mat});
  G.dice=[];draw();
  done(head+shown.join(", ")+".",false);
  return}
 var m=seq[k],hit=(G.s.p[m.t]===P);
 if(hit)G.hitCt[A]++;
 step(G.s,A,m);
 G.trail.push({f:m.f,t:m.t,d:m.d,hit:hit,tone:"a",pl:A});
 shown.push((m.f===0?"bar":m.f)+"/"+(m.t>24?"off":m.t)+(hit?"*":""));
 mat.push((m.f===0?"bar":(25-m.f))+"/"+(m.t>24?"off":(25-m.t))+(hit?"*":""));
 var ix=G.dice.indexOf(m.d);if(ix>-1)G.dice.splice(ix,1);
 G.usedDice.push(m.d);
 k++;draw();say(head+shown.join(", ")+".");
 setTimeout(next,T(CTRL?1100:1450))})()}

/* ---------- cube ---------- */
function winChanceA(){
var pa=pip(G.s,A),pp=pip(G.s,P);
var lead=pp-pa, tot=Math.max(40,pa+pp);
var x=0.5+1.6*lead/tot;
if(G.s.bar[P]>0)x+=0.05; if(G.s.bar[A]>0)x-=0.05;
return Math.max(0.02,Math.min(0.98,x))}
function shouldDouble(){
if(G.cube>=64)return false;
if(!(G.cubeOwner===0||G.cubeOwner===A))return false;
if(M.sc[A]+G.cube>=M.target)return false;
var w=winChanceA();
return w>0.70&&w<0.86}

G.busy=true;

 setTimeout(function(){aiPlay(roll2(),false)},800)};
$("bPass").onclick=function(){box.hidden=true;box.innerHTML="";

function playerDouble(){

G.log.push({pl:P,cube:"Doubles => "+nv});
G.busy=true;say("You double to <b>"+nv+"</b>. Thinking.");

 if(wA>0.78){G.log.push({pl:A,cube:"Drops"});endGame(P,G.cube,true);return}

function padR(s,n){s=String(s);while(s.length<n)s+=" ";return s}
function padL(s,n){s=String(s);while(s.length<n)s=" "+s;return s}
function matText(){
var L=[];
L.push(" "+M.target+" point match");
var all=M.games.slice();
var liveDone=false;
for(var gi=0;gi<all.length;gi++)if(all[gi].no===M.gameNo)liveDone=true;
if(!liveDone&&G.log.length)all.push({no:M.gameNo,winner:0,pts:0,log:G.log.slice(),
 scP:M.sc[P],scA:M.sc[A]});
for(var gx=0;gx<all.length;gx++){
 var gm=all[gx],pre={p:0,a:0};
 /* score BEFORE this game */
 pre.p=gm.scP-(gm.winner===P?gm.pts:0);
 pre.a=gm.scA-(gm.winner===A?gm.pts:0);
 L.push("");L.push(" Game "+gm.no);
 L.push(" "+ME+" : "+pre.p+padL(OPP+" : "+pre.a,45-(ME+" : "+pre.p).length));
 var rows=[],i=0,LG=gm.log;
 while(i<LG.length){var a=null,b=null;
  if(LG[i].pl===P){a=LG[i];i++;if(i<LG.length&&LG[i].pl===A){b=LG[i];i++}}
  else{b=LG[i];i++}
  rows.push([a,b])}
 for(var r=0;r<rows.length;r++)
  L.push(padL((r+1)+")",4)+" "+padR(matCell(rows[r][0]),38)+matCell(rows[r][1]));
 if(gm.winner===P)L.push(padL((rows.length+1)+")",4)+" "+padR("Wins "+gm.pts+" point"+(gm.pts>1?"s":""),38));
 else if(gm.winner===A)L.push(padL((rows.length+1)+")",4)+" "+padR("",38)+"Wins "+gm.pts+" point"+(gm.pts>1?"s":""))}
L.push("");
return L.join("\n")}
function matCell(e){

/* ---------- ledger storage ----------
   mode "db":    the artifact's own store (claude.ai, follows the account)
   mode "local": this browser's localStorage (public web app)
   mode "none":  storage refused (private window etc.) */
var LKEY="gammon-ledger-games-v1",store={mode:"pending",queue:[]};
function byTs(a,b){return (b.ts||0)-(a.ts||0)}
function localRead(){try{var r=localStorage.getItem(LKEY),a=r?JSON.parse(r):[];
 return Array.isArray(a)?a:[]}catch(e){return null}}

 return true}catch(e){return false}}

 var a=localRead();

 else{store.mode="local";hist=a.sort(byTs)}

function flushQueue(){var q=store.queue;store.queue=[];
 for(var i=0;i<q.length;i++)storeAdd(q[i])}
function storeAdd(rec){
 if(store.mode==="pending"){store.queue.push(rec);return Promise.resolve(true)}
 if(store.mode==="db"&&db)
  return db.collection("games").add(rec).then(function(){return true},function(){return false});
 if(store.mode==="local"){var a=localRead()||[];a.unshift(rec);var ok=localWrite(a);
  hist=(localRead()||[]).sort(byTs);refreshHist();return Promise.resolve(ok)}

  JSON.stringify({app:"gammon-ledger",version:1,exported:new Date().toISOString(),games:hist},null,1),
  "application/json",btn)}
var ledMsg="";
function ledSay(t){ledMsg=t;var n=$("ledNote");if(n)n.textContent=t}
function importLedger(file){

 fr.onload=function(){
  var data;
  try{data=JSON.parse(fr.result)}catch(e){ledSay("That file isn't a ledger export.");return}
  var games=Array.isArray(data)?data:(data&&Array.isArray(data.games)?data.games:null);
  if(!games){ledSay("That file isn't a ledger export.");return}
  var have={};for(var i=0;i<hist.length;i++)have[hist[i].ts]=1;
  var add=games.filter(function(g){return g&&typeof g.ts==="number"&&!have[g.ts]}).slice(0,500);
  var done="Imported "+add.length+" game"+(add.length>1?"s":"")+".";
  if(!add.length){ledSay("Nothing new — every game in that file is already here.");return}
  if(store.mode==="local"){
   var ok=localWrite((localRead()||[]).concat(add));
   ledMsg=ok?done:"This browser refused to store them.";
   hist=(localRead()||[]).sort(byTs);renderHist();return}
  if(store.mode==="db"){var n=0;
   (function next(){
    if(n>=add.length){ledSay(done);return}
    db.collection("games").add(add[n]).then(function(){n++;next()},
     function(){ledSay("Imported "+n+" before the store refused the rest.")})})();
   return}
  ledSay("Storage isn't available in this view.")};

/* ================= online play =================
   One Firestore document per match holds an ordered event list; both
   browsers rebuild the board by replaying it. Board side P is always the
   local player; doc sides are "h" (host) and "g" (guest).

   Fair dice: at the start of each game every player publishes the tip of a
   private SHA-256 hash chain (c[0] = H(c[1]) = ... = H^N(seed)). Each roll r
   combines both players' element c[r]; elements are revealed one at a time
   and checked against the previous one, so neither side can bias a roll or
   see the other side's future rolls. */
ONLINE=(function(){
var N=600;
var cfg=window.GAMMON_FIREBASE||null;
if(cfg&&(!cfg.apiKey||/PASTE|YOUR_/i.test(cfg.apiKey)))cfg=null;
var MOCK=window.GAMMON_BACKEND==="mock";
var HEARTBEAT=window.GAMMON_HEARTBEAT_MS||45000;
var BASE_TITLE=document.title,DEFAULT_OPP=OPP;
var be=null,uid=null,booting=null;
var code=null,side=null,opp=null,spect=false;
var doc=null,unsub=null,chatUnsub=null;
var applied=0,curNo=0,busyTx=false,animating=false,startedRoll=-1,settleKey="";
var chains={},lastDice={},hb=null,warnMsg="",verifiedTo={};
var chatMsgs=[],lastSend=0,selLen=3,mineCache=[];
var api={};

/* ---------- small helpers ---------- */
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function other(x){return x==="h"?"g":"h"}
function bs(x){return x===side?P:A}
function escA(t){return esc(t).replace(/"/g,"&quot;")}
function myName(){return (lsGet("gl-name")||"").trim().slice(0,24)}
function sum(a){return a.reduce(function(x,y){return x+y},0)}
function enc(t){return new TextEncoder().encode(t)}
function hex(b){var o="";for(var i=0;i<b.length;i++)o+=(b[i]<16?"0":"")+b[i].toString(16);return o}
function unhex(h){var a=new Uint8Array(h.length/2);for(var i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a}
function cat(){var n=0,i,o,k=0;for(i=0;i<arguments.length;i++)n+=arguments[i].length;o=new Uint8Array(n);
 for(i=0;i<arguments.length;i++){o.set(arguments[i],k);k+=arguments[i].length}return o}
function sha(b){return crypto.subtle.digest("SHA-256",b).then(function(x){return new Uint8Array(x)})}
function newCode(){var al="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",r=new Uint8Array(6),o="";
 crypto.getRandomValues(r);for(var i=0;i<6;i++)o+=al[r[i]%32];return o}
function link(c){return location.origin+location.pathname+"#join="+c}

/* ---------- dice from two hash chains ---------- */
async function buildChain(seed){var c=new Array(N+1);c[N]=seed;
 for(var k=N-1;k>=0;k--)c[k]=hex(await sha(unhex(c[k+1])));return c}
async function chainFor(cd,no,sd,create){
 var key="gl-seed:"+cd+":"+no+":"+sd;
 if(chains[key])return chains[key];
 var seed=lsGet(key);
 if(!seed){if(!create)return null;var r=new Uint8Array(32);crypto.getRandomValues(r);seed=hex(r);lsSet(key,seed)}
 chains[key]=await buildChain(seed);return chains[key]}
function two(b){var o=[];for(var i=0;i<b.length&&o.length<2;i++)if(b[i]<252)o.push(b[i]%6+1);return o}
async function diceFor(hEl,gEl,r){
 var b=await sha(cat(unhex(hEl),unhex(gEl),enc("roll:"+r))),d=two(b);
 while(d.length<2){b=await sha(b);d=two(b)}
 return d[0]===d[1]?[d[0],d[0],d[0],d[0]]:[d[0],d[1]]}
async function openingFor(h1,g1){
 for(var k=0;k<64;k++){var d=two(await sha(cat(unhex(h1),unhex(g1),enc("open:"+k))));
  if(d.length===2&&d[0]!==d[1])return{dice:[d[0],d[1]],first:d[0]>d[1]?"h":"g"}}
 throw new Error("opening")}
async function chainValid(ch){
 if(!ch||!ch.tip)return true;
 var prev=ch.tip;
 for(var i=0;i<ch.rev.length;i++){if(hex(await sha(unhex(ch.rev[i])))!==prev)return false;prev=ch.rev[i]}
 return true}

/* Re-derives every roll in the current game from the published chains and
   flags any mismatch. Runs in the background; never blocks play. */
async function audit(){
 var d=doc;if(!d||!d.cur||!d.cur.chain)return;
 var c=d.cur,key=code+":"+c.no;
 if((verifiedTo[key]||0)>=c.events.length)return;
 try{
  if(!(await chainValid(c.chain.h))||!(await chainValid(c.chain.g))){warn("A dice key in this game doesn't check out, so its rolls can't be trusted.");return}
  for(var i=(verifiedTo[key]||0);i<c.events.length;i++){var e=c.events[i];
   if(e.k==="open"){var o=await openingFor(c.chain.h.rev[0],c.chain.g.rev[0]);
    if(o.dice[0]!==e.dice[0]||o.dice[1]!==e.dice[1]||o.first!==e.first){warn("The opening roll doesn't match both players' dice keys.");return}}
   if(e.k==="roll"){var hE=c.chain.h.rev[e.r-1],gE=c.chain.g.rev[e.r-1];
    if(!hE||!gE){warn("A roll was made without both dice keys.");return}
    var dd=await diceFor(hE,gE,e.r);
    if(dd.join()!==e.dice.join()){warn("Roll "+e.r+" doesn't match the dice keys — it may have been tampered with.");return}}}
  verifiedTo[key]=c.events.length}catch(err){}}
function warn(t){warnMsg=t;var w=$("olwarn");if(w){w.textContent=t;w.hidden=!t}}

/* Checks the opponent played a legal, maximal sequence for their dice. */
function movesOK(s0,dice,seq){
 var mx=0;walk(clone(s0),A,dice,[],function(st,sq){if(sq.length>mx)mx=sq.length},null);
 if(seq.length!==mx)return false;
 var s=clone(s0),d=dice.slice();
 for(var i=0;i<seq.length;i++){var ms=legal(s,A,d),m=seq[i],ok=false;
  for(var j=0;j<ms.length;j++)if(ms[j].f===m.f&&ms[j].t===m.t&&ms[j].d===m.d)ok=true;
  if(!ok)return false;step(s,A,m);d.splice(d.indexOf(m.d),1)}
 return true}
function flip(m){return{f:25-m.f,t:25-m.t,d:m.d}}

/* ---------- backend ---------- */
function loadScripts(){
 var list=["vendor/firebase-app-compat.js","vendor/firebase-auth-compat.js","vendor/firebase-firestore-compat.js","backend-firebase.js"];
 return list.reduce(function(p,src){return p.then(function(){return new Promise(function(res,rej){
  var el=document.createElement("script");el.src=src;el.onload=res;el.onerror=function(){rej(new Error("load"))};
  document.head.appendChild(el)})})},Promise.resolve())}
function start(){
 if(booting)return booting;
 if(!cfg&&!MOCK)return Promise.reject(new Error("noconfig"));
 booting=(MOCK?Promise.resolve():loadScripts())
  .then(function(){be=window.GammonBackendFactory(cfg);return be.start()})
  .then(function(u){uid=u;return u});
 booting.catch(function(){booting=null});
 return booting}

/* ---------- opening, creating, joining ---------- */
async function create(target,listed){
 var nm=myName();if(!nm)throw new Error("name");
 await start();
 for(var tries=0;tries<5;tries++){
  var c=newCode(),ch=await chainFor(c,1,"h",true),now=Date.now();
  var data={v:1,code:c,created:now,updated:now,target:target,
   host:{uid:uid,name:nm},guest:null,players:[uid],score:{h:0,g:0},gameNo:1,games:[],phase:"waiting",
   cur:{no:1,events:[],chain:{h:{tip:ch[0],rev:[ch[1]]}},turn:null,step:"wait",dice:null,rolls:0,cube:1,owner:null,offer:null},
   next:null,seen:{h:now},rematch:null,listed:listed!==false};
  try{await be.create(c,data);return c}catch(e){if(String(e&&e.message).indexOf("taken")<0)throw e}}
 throw new Error("create")}
async function join(c){
 var nm=myName();if(!nm)throw new Error("name");
 await start();
 var ch=await chainFor(c,1,"g",true);
 return be.update(c,async function(d){
  if(!d)throw new Error("missing");
  if(d.host.uid===uid)return{result:"host"};
  if(d.guest){if(d.guest.uid===uid)return{result:"seated"};throw new Error("full")}
  if(!(await chainValid(d.cur.chain.h)))throw new Error("tamper");
  var o=await openingFor(d.cur.chain.h.rev[0],ch[1]);
  d.guest={uid:uid,name:nm};d.players=[d.host.uid,uid];
  d.cur.chain.g={tip:ch[0],rev:[ch[1]]};
  d.cur.events=[{k:"open",dice:o.dice,first:o.first}];
  d.cur.turn=o.first;d.cur.step="move";d.cur.dice=o.dice;d.cur.rolls=1;
  d.phase="play";d.updated=Date.now();d.seen=d.seen||{};d.seen.g=Date.now();
  return{data:d,result:"joined"}})}

/* ---------- snapshot handling ---------- */
function onDoc(d){
 if(!d){say("There's no game with that code.");detach();return}
 doc=d;
 if(d.host.uid===uid)side="h";

function sync(){

 if(d.phase==="waiting"){waiting();return}

function blankBoard(){
 M={target:doc.target,sc:{1:0,"-1":0},gameNo:1,games:[],done:false};
 G={s:fresh(),dice:[],turn:A,cube:1,cubeOwner:0,sel:null,allowed:[],busy:true,over:false,
  trail:[],hist:[],log:[],turnNo:0,startS:null,startDice:[],notes:[],moves:[],
  diceTot:{1:0,"-1":0},hitCt:{1:0,"-1":0},errs:[],decisions:0,loss:0,cats:{},
  rolled:[],usedDice:[],rollOwner:0,opening:false,winner:0,pts:0};
 ui.review=null}
/* Rebuild the whole board from the event log, without animation. */
function rebuild(){
 var d=doc;
 api.replaying=true;
 setNames(oppName(),meName());
 curNo=d.cur.no;applied=0;startedRoll=-1;settleKey="";lastDice={};
 var prior=(d.games||[]).filter(function(g){return g.no!==d.cur.no});
 blankBoard();M.gameNo=d.cur.no;
 prior.forEach(function(g){
  var w=g.winner===side?P:A;M.sc[w]+=g.pts;
  M.games.push({no:g.no,winner:w,pts:g.pts,log:logOf(g.events),scP:M.sc[P],scA:M.sc[A]})});
 $("matbox").hidden=true;$("matbox").innerHTML="";
 var evs=d.cur.events;
 for(var i=0;i<evs.length;i++){instant(evs[i],i);applied=i+1}
 api.replaying=false;
 $("pane-rev").innerHTML="";

/* The move sheet for a finished game, rebuilt from its events. */
function logOf(evs){
 var s=fresh(),log=[],ld={},cube=1;
 evs.forEach(function(e){
  if(e.k==="open")ld[e.first]=e.dice;
  else if(e.k==="roll")ld[e.by]=e.dice;
  else if(e.k==="move"){var who=bs(e.by),notes=[];
   e.moves.forEach(function(m){var bm=who===P?m:flip(m),hit=(s.p[bm.t]===-who);step(s,who,bm);
    notes.push((m.f===25?"bar":m.f)+"/"+(m.t===0?"off":m.t)+(hit?"*":""))});
   log.push({pl:who,dice:(ld[e.by]||[]).slice(0,2),moves:notes})}
  else if(e.k==="double")log.push({pl:bs(e.by),cube:"Doubles => "+e.to});
  else if(e.k==="take")log.push({pl:bs(e.by),cube:"Takes"});
  else if(e.k==="drop")log.push({pl:bs(e.by),cube:"Drops"})});
 return log}

/* Apply one event straight to G (used when rebuilding). */
function instant(e,idx){
 if(e.k==="open"){
  G.diceTot[bs("h")]+=e.dice[0];G.diceTot[bs("g")]+=e.dice[1];
  lastDice[e.first]=e.dice.slice();G.rolled=e.dice.slice();G.rollOwner=0;G.usedDice=[];return}
 if(e.k==="roll"){lastDice[e.by]=e.dice.slice();G.diceTot[bs(e.by)]+=sum(e.dice);
  G.rolled=e.dice.slice();G.rollOwner=bs(e.by);G.usedDice=[];return}
 if(e.k==="move"){
  var dice=lastDice[e.by]||[];
  if(e.by===side){
   G.turnNo++;G.startS=clone(G.s);G.startDice=dice.slice();G.notes=[];G.moves=[];G.trail=[];
   e.moves.forEach(function(m){var hit=(G.s.p[m.t]===A);if(hit)G.hitCt[P]++;step(G.s,P,m);
    G.moves.push({f:m.f,t:m.t,d:m.d});G.notes.push((m.f===25?"bar":m.f)+"/"+(m.t<1?"off":m.t)+(hit?"*":""))});
   G.log.push({pl:P,dice:dice.slice(0,2),moves:G.notes.slice()});
   gradeTurn()}
  else{
   var notes=[];G.trail=[];
   e.moves.forEach(function(m){var bm=flip(m),hit=(G.s.p[bm.t]===P);if(hit)G.hitCt[A]++;
    step(G.s,A,bm);G.trail.push({f:bm.f,t:bm.t,d:bm.d,hit:hit,tone:"a",pl:A});
    notes.push((m.f===25?"bar":m.f)+"/"+(m.t===0?"off":m.t)+(hit?"*":""))});
   G.log.push({pl:A,dice:dice.slice(0,2),moves:notes})}
  G.rolled=dice.slice();G.rollOwner=bs(e.by);G.usedDice=dice.slice();return}
 if(e.k==="double"){G.log.push({pl:bs(e.by),cube:"Doubles => "+e.to});return}
 if(e.k==="take"){G.cube=e.to;G.cubeOwner=bs(e.by);G.log.push({pl:bs(e.by),cube:"Takes"});return}
 if(e.k==="drop"){G.log.push({pl:bs(e.by),cube:"Drops"});return}
 if(e.k==="end"){endGame(e.winner===side?P:A,e.pts,e.kind==="drop")}}

/* Apply the next unseen event live, animating the opponent's moves. */
function nextEvent(){
 var d=doc,e=d.cur.events[applied];
 if(e.by===side&&e.k!=="end"){rebuild();return}   // our own event we didn't apply here: resync
 if(e.k==="open"){instant(e,applied);applied++;draw();return sync()}
 if(e.k==="roll"){
  lastDice[e.by]=e.dice.slice();G.diceTot[A]+=sum(e.dice);
  G.rolled=e.dice.slice();G.rollOwner=A;G.usedDice=[];G.trail=[];
  applied++;draw();say(esc(OPP)+" rolled <b>"+e.dice[0]+"-"+e.dice[1]+"</b>.");audit();return sync()}
 if(e.k==="move"){
  var dice=lastDice[e.by]||[],seq=e.moves.map(flip);
  if(!movesOK(G.s,dice,seq))warn(OPP+"'s last move doesn't look legal for "+dice.slice(0,2).join("-")+". It's shown as played.");

 pal.innerHTML=EM.map(function(x){return '<button type="button" aria-label="'+x+'">'+x+'</button>'}).join("");
 $("chatEmojiBtn").addEventListener("click",function(){
  var open=pal.hidden;pal.hidden=!open;this.setAttribute("aria-expanded",String(open))});
 pal.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  var i=$("chatText"),a=i.selectionStart==null?i.value.length:i.selectionStart,z=i.selectionEnd==null?a:i.selectionEnd;
  i.value=(i.value.slice(0,a)+b.textContent+i.value.slice(z)).slice(0,500);
  var p=a+b.textContent.length;
  /* desktop: put the cursor back in the box after the emoji. On phones this
     would pop the keyboard over the palette, so leave focus alone there. */
  if(window.matchMedia&&matchMedia("(pointer:fine)").matches)i.focus({preventScroll:true});
  try{i.setSelectionRange(p,p)}catch(err){}});
 /* photos */
 $("chatPicBtn").addEventListener("click",function(){$("chatPic").click()});
 $("chatPic").addEventListener("change",function(){
  var file=this.files&&this.files[0];this.value="";
  if(!file)return;
  if(!/^image\//.test(file.type||"image/")){say("That isn't a picture.");return}
  var btn=$("chatPicBtn");btn.disabled=true;
  shrinkPhoto(file).then(function(data){return postChat({img:data})})
   .catch(function(e){say(String(e.message)==="too big"?"That photo is too large to send, even shrunk.":"Couldn't read that picture. Try a JPEG or PNG.")})
   .then(function(){btn.disabled=false})});
 /* vanish toggle */
 $("chatVanish").addEventListener("click",function(){setVanish(!vanMode)});
 /* start countdowns the moment the chat comes into view */
 document.addEventListener("visibilitychange",function(){if(code&&!document.hidden)renderChat()})})();

/* ---------- lobby ---------- */
function lobbyMsg(id,t){var el=$(id);if(el)el.textContent=t}
function lobby(){
 var el=$("pane-online");if(!el)return;
 if(!cfg&&!MOCK){
  el.innerHTML='<h2>Play a friend</h2><div class="card" style="margin-top:12px"><p>Online play isn\'t switched on for this copy yet.</p>'+
   '<p class="cap">It needs a free Firebase project for the two browsers to talk through. The steps are in SETUP.md — about ten minutes, no card required. Everything else works without it.</p></div>';return}
 var listedPref=lsGet("gl-listed")!=="0";
 var h='<h2>Play a friend</h2><p class="cap" style="margin-top:4px">Join an open game below, start your own, or join with a code. Games wait if either of you leaves — pick up any time.</p>'+
  '<div class="cards">'+
  '<div class="card"><label class="lbl" for="olName">Your name</label><input class="txt" id="olName" maxlength="24" autocomplete="nickname" placeholder="Sam" value="'+escA(myName())+'"></div>'+
  '<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><span class="lbl">Open games</span><button class="linkbtn" id="olRefresh">Refresh</button></div>'+
   '<div class="opengames" id="olOpen"><p class="cap">Looking for games.</p></div></div>'+
  '<div class="card"><span class="lbl">New match</span><div class="row" id="olLen">'+
   [1,3,5,7].map(function(n){return '<button class="btn" data-olen="'+n+'" aria-pressed="'+(n===selLen)+'">'+n+' point'+(n>1?"s":"")+'</button>'}).join("")+
   '</div><label class="tick"><input type="checkbox" id="olListed"'+(listedPref?' checked':'')+'><span>Show in Open games, so anyone using this site can join without the code</span></label>'+
   '<button class="btn go" id="olCreate">Create game</button><p class="cap" id="olMsg1"></p></div>'+
  '<div class="card"><label class="lbl" for="olCode">Join with a code</label><div class="row"><input class="txt" id="olCode" maxlength="6" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="K7M2QX" style="flex:1 1 140px;font-family:var(--font-m);letter-spacing:.1em;text-transform:uppercase"><button class="btn go" id="olJoin" style="flex:0 0 auto">Join</button></div><p class="cap" id="olMsg2"></p></div>'+
  '<div class="card"><span class="lbl">Your games</span><div class="mine" id="olMine"><p class="cap">Loading.</p></div></div>'+
  '</div>';
 el.innerHTML=h;
 $("olName").addEventListener("change",function(){lsSet("gl-name",this.value.trim().slice(0,24))});
 $("olName").addEventListener("input",function(){lsSet("gl-name",this.value.trim().slice(0,24))});
 $("olLen").addEventListener("click",function(e){var b=e.target.closest("[data-olen]");if(!b)return;
  selLen=+b.getAttribute("data-olen");this.querySelectorAll("[data-olen]").forEach(function(x){x.setAttribute("aria-pressed",String(+x.getAttribute("data-olen")===selLen))})});
 $("olCreate").onclick=function(){
  if(!myName()){lobbyMsg("olMsg1","Add your name first.");$("olName").focus();return}
  var b=this;b.disabled=true;lobbyMsg("olMsg1","Creating.");
  var listed=$("olListed").checked;lsSet("gl-listed",listed?"1":"0");
  create(selLen,listed).then(function(c){return open(c)}).catch(function(e){b.disabled=false;lobbyMsg("olMsg1",errText(e))})};
 $("olRefresh").onclick=function(){loadOpen()};
 $("olOpen").onclick=function(e){
  var b=e.target.closest("[data-join]");if(!b)return;
  var c=b.getAttribute("data-join");
  if(!myName()){lobbyMsg("olMsg1","");$("olName").focus();b.textContent="Add your name above";return}
  b.disabled=true;b.textContent="Joining";
  join(c).then(function(){return open(c)}).catch(function(e2){
   b.disabled=false;b.textContent="Join";
   if(String(e2.message)==="full"){b.textContent="Taken";b.disabled=true;setTimeout(loadOpen,800);return}
   var row=b.closest(".og");if(row){var n=row.querySelector(".sub2");if(n)n.textContent=errText(e2)}})};
 $("olJoin").onclick=function(){
  var c=($("olCode").value||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(c.length!==6){lobbyMsg("olMsg2","Codes are six letters and numbers.");return}
  if(!myName()){lobbyMsg("olMsg2","Add your name first.");$("olName").focus();return}
  var b=this;b.disabled=true;lobbyMsg("olMsg2","Joining.");
  join(c).then(function(){return open(c)}).catch(function(e){b.disabled=false;
   if(String(e.message)==="full"){lobbyMsg("olMsg2","That game already has two players — opening it to watch.");open(c);return}
   lobbyMsg("olMsg2",errText(e))})};
 loadMine();loadOpen();startOpenPoll()}
var openPoll=null;
function startOpenPoll(){stopOpenPoll();openPoll=setInterval(function(){
 if($("pane-online")&&!$("pane-online").hidden&&!document.hidden)loadOpen()},15000)}
function stopOpenPoll(){if(openPoll){clearInterval(openPoll);openPoll=null}}
function ago(t){var m=Math.round((Date.now()-t)/60000);
 return m<1?"just now":m<60?m+" min ago":m<1440?Math.round(m/60)+" h ago":Math.round(m/1440)+" d ago"}
/* Games waiting for a second player that their host chose to list. */
function loadOpen(){
 start().then(function(){return be.openGames?be.openGames():[]}).then(function(list){
  var el=$("olOpen");if(!el)return;
  var now=Date.now();
  list=list.filter(function(d){return d&&d.phase==="waiting"&&!d.guest&&d.listed!==false&&d.host&&d.host.uid!==uid&&now-(d.created||0)<2*86400000})
   .sort(function(a,b){return (b.created||0)-(a.created||0)}).slice(0,12);
  if(!list.length){el.innerHTML='<p class="cap">No one is waiting right now. Create a game and it appears here for others.</p>';return}
  el.innerHTML=list.map(function(d){
   return '<div class="og"><span><b>'+esc(d.host.name||"Someone")+'</b> <span class="cap">· match to '+d.target+'</span></span>'+
    '<button class="btn go" data-join="'+escA(d.code)+'">Join</button>'+
    '<span class="sub2">started '+ago(d.created||now)+'</span></div>'}).join("")})
 .catch(function(e){var el=$("olOpen");if(el)el.innerHTML='<p class="cap">'+esc(errText(e))+'</p>'})}
function errText(e){var m=String(e&&e.message||e);
 return m==="name"?"Add your name first.":m==="missing"?"There's no game with that code.":m==="tamper"?"That game's dice keys don't check out.":
  m==="noconfig"?"Online play isn't set up on this copy.":m==="load"?"Couldn't load the online components. Check your connection.":"Something went wrong: "+m}
function loadMine(){
 start().then(function(){return be.mine(uid)}).then(function(list){
  mineCache=list.sort(function(a,b){return (b.updated||0)-(a.updated||0)}).slice(0,20);
  var el=$("olMine");if(!el)return;
  if(!mineCache.length){el.innerHTML='<p class="cap">No games yet.</p>';return}
  el.innerHTML=mineCache.map(function(d){
   var sd=d.host.uid===uid?"h":"g",os=other(sd),on=d[os==="h"?"host":"guest"];
   var st,go=false;
   if(d.phase==="waiting"){st="waiting for a friend"}
   else if(d.phase==="over"){st=(d.score[sd]>=d.target?"you won ":"lost ")+d.score[sd]+"–"+d.score[os]}
   else if(d.phase==="between"){st="game "+d.gameNo+" finished"}
   else if(d.cur.step==="cube"&&d.cur.offer===os){st="answer the double";go=true}
   else if(d.cur.turn===sd){st="your move";go=true}
   else st="their move";
   return '<button class="mrow" data-code="'+escA(d.code)+'"><span><b>'+(on?esc(on.name):"Open seat")+'</b> <span class="cap">· to '+d.target+'</span></span>'+
    '<span class="st'+(go?" go":"")+'">'+st+'</span><span class="sub2">'+d.score[sd]+'–'+d.score[os]+' · code '+esc(d.code)+'</span></button>'}).join("");
  el.onclick=function(e){var b=e.target.closest("[data-code]");if(b)open(b.getAttribute("data-code"))}})
 .catch(function(e){var el=$("olMine");if(el)el.innerHTML='<p class="cap">'+esc(errText(e))+'</p>'})}

/* ---------- controller interface used by the core ---------- */
api.roll=roll;api.double=double;api.turnDone=turnDone;api.detach=function(){detach(false)};
api.afterEnd=function(box){if(!api.replaying&&doc)afterEndBox()};
api.gameKey=function(){return code?code+":"+curNo+":"+side:null};
api.replaying=false;
function tab(which){
 if(which==="online")lobby();else stopOpenPoll();
 if(which==="play"){if(code&&chatUnsub)renderChat();else markTab()}}

/* ---------- boot: deep links ---------- */
function boot(){
 var t=$("tab-online");if(t)t.addEventListener("click",function(){if(ui.review)exitReview();showTab("online")});
 var m=location.hash.match(/^#(join|g)=([A-Za-z0-9]{6})$/);
 if(!m)return;
 var c=m[2].toUpperCase();
 if(!cfg&&!MOCK){showTab("online");return}
 if(m[1]==="g"){open(c).catch(function(e){showTab("online");lobbyMsg("olMsg2",errText(e))});return}
 if(!myName()){showTab("online");$("olCode").value=c;lobbyMsg("olMsg2","Add your name, then press Join.");$("olName").focus();return}
 join(c).then(function(){return open(c)}).catch(function(e){
  if(String(e.message)==="full"){open(c);return}
  showTab("online");$("olCode").value=c;lobbyMsg("olMsg2",errText(e))})}
setTimeout(boot,0);
return{tab:tab,open:open,_state:function(){return{code:code,side:side,applied:applied,doc:doc,uid:uid,spect:spect}}}})();

draw();
})();
</script>

  var local=location.hostname==="localhost"||location.hostname==="127.0.0.1";
  if(!("serviceWorker" in navigator))return;
  if(location.protocol!=="https:"&&!local)return;
  window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){})});
})();
